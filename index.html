<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!--
    ==========================================================================
    SEO / SOCIAL SURFACE  (build-time output, not runtime content)
    ==========================================================================
    These tags stay static in the HTML on purpose. Social and search crawlers
    (including WhatsApp's link preview fetcher) do NOT run JavaScript, so this
    content must be present in the served HTML.
    ==========================================================================
  -->
  <title>Maarifatullah Snacks</title>
  <meta name="description" content="Fresh homemade snacks with fast delivery in Kano. Browse the menu and order straight to your door on WhatsApp.">
  <meta name="theme-color" content="#fbf5ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1324" media="(prefers-color-scheme: dark)">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Maarifatullah Snacks">
  <meta property="og:description" content="Fresh homemade snacks in Kano, delivered fast. Order via WhatsApp.">
  <meta property="og:image" content="images/hero1.png">
  <meta property="og:locale" content="en_NG">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="images/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="preconnect" href="https://cdn.sanity.io" crossorigin>
  <link rel="stylesheet" href="style.css">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "LocalBusiness",
    "name": "Maarifatullah Snacks",
    "image": "images/logo.png",
    "description": "Fresh homemade snacks with fast delivery in Kano.",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Kano",
      "addressCountry": "NG"
    }
  }
  </script>

  <!--
    NOTE: the JSON-LD above mirrors business.* in content.js. It is duplicated
    because crawlers do not execute JavaScript.
  -->
</head>

<body>

<!--
  ==========================================================================
  STRUCTURE ONLY — no content is hard-coded below.
  Every text node, card, image and link is rendered by script.js from the
  data in content.js (and the live menu from Sanity).
  ==========================================================================
-->

<a class="skip-link" href="#products">Skip to menu</a>

<!-- NAVBAR -->
<header class="site-header" id="site-header">
  <nav class="navbar" aria-label="Main">
    <a class="brand-link" href="#home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 3a4.5 4.5 0 0 0-4.3 3.2A4 4 0 0 0 6 14v5.5A1.5 1.5 0 0 0 7.5 21h9a1.5 1.5 0 0 0 1.5-1.5V14a4 4 0 0 0-1.7-7.8A4.5 4.5 0 0 0 12 3Zm-4 13h8v3H8v-3Z"/></svg>
      </span>
      <span class="brand" id="brand"></span>
    </a>

    <ul id="nav-links" class="nav-links"></ul>

    <div class="nav-actions">
      <button id="mode-toggle" class="icon-btn mode-btn" type="button" aria-label="Toggle dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g></svg>
      </button>

      <div id="cart-icon" class="cart-icon" role="button" tabindex="0" aria-label="Open cart" data-count="0">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M6 7h12l-1 13H7L6 7Zm3 0V6a3 3 0 0 1 6 0v1"/></svg>
        <span class="cart-icon-label">Cart</span>
        <span id="cart-count" class="count-badge">0</span>
      </div>

      <button id="menu-toggle" class="icon-btn menu-toggle" type="button" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="nav-links">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 7h16M4 12h16M4 17h10"/></svg>
      </button>
    </div>
  </nav>
</header>

<main>

<!-- HERO -->
<section class="hero" id="home">
  <div class="hero-inner">
    <div class="hero-content">
      <p id="hero-eyebrow" class="hero-eyebrow" hidden></p>
      <h1 id="hero-headline"></h1>
      <p id="hero-description" class="hero-description"></p>
      <div id="hero-actions" class="hero-actions"></div>
      <ul id="hero-highlights" class="hero-highlights" hidden></ul>
    </div>

    <div class="hero-visual">
      <div class="hero-shape" aria-hidden="true"></div>
      <div class="hero-frame">
        <img id="hero-image" class="hero-image" src="" alt="" width="688" height="384" fetchpriority="high">
      </div>
      <span class="hero-sparkle hero-sparkle-1" aria-hidden="true">✦</span>
      <span class="hero-sparkle hero-sparkle-2" aria-hidden="true">✦</span>
    </div>
  </div>
</section>

<!-- PRODUCT TICKER (built from the live menu; decorative) -->
<div id="ticker" class="ticker" aria-hidden="true" hidden>
  <div class="ticker-track" id="ticker-track"></div>
</div>

<!-- PROMOTIONAL BANNER (renders nothing while content.promo is absent) -->
<div id="promo-slot" class="promo-slot" hidden></div>


<!-- PRODUCTS -->
<section id="products" class="products section">
  <div class="section-head">
    <h2 id="menu-heading" class="section-title"></h2>
    <p id="menu-subheading" class="section-subtitle" hidden></p>
  </div>

  <!--
    Category filter: rendered by script.js only when at least one product
    actually has a category. With no categories, it stays hidden.
  -->
  <div id="category-filter" class="category-filter" role="group" aria-label="Filter menu by category" hidden></div>

  <div class="grid" id="products-grid">
    <!-- Product cards are rendered dynamically by script.js -->
  </div>

  <p id="menu-empty" class="menu-empty" hidden></p>
</section>


<!-- HOW TO ORDER (renders nothing while content.howToOrder has no steps) -->
<section id="how-to-order" class="steps section fade" hidden>
  <div class="section-head">
    <h2 id="steps-heading" class="section-title"></h2>
  </div>
  <ol id="steps-list" class="steps-list"></ol>
</section>


<!-- ABOUT -->
<section id="about" class="about section fade">
  <div class="about-panel">
    <h2 id="about-heading"></h2>
    <div id="about-body" class="about-body"></div>
    <div id="about-actions" class="about-actions"></div>
  </div>
</section>

<!-- TESTIMONIALS (renders nothing while content.testimonials is empty) -->
<div id="testimonials-slot" class="testimonials-slot section" hidden></div>

</main>


<!-- FLOATING CART (small screens) -->
<div id="floating-cart" class="cart" role="button" tabindex="0" aria-label="Open cart" data-count="0">
  <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M6 7h12l-1 13H7L6 7Zm3 0V6a3 3 0 0 1 6 0v1"/></svg>
  <span id="cart-count-2" class="count-badge">0</span>
</div>


<!-- CART PANEL -->
<aside id="cart-panel" class="cart-panel" aria-label="Shopping cart">

  <div class="cart-head">
    <h2>Your cart</h2>
    <button id="close-cart" class="icon-btn close-cart" type="button" aria-label="Close cart">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <div id="cart-items"></div>

  <div class="cart-foot">
    <p class="cart-total-row"><span>Total</span> <span id="cart-total">0</span></p>

    <button id="checkout-btn" class="checkout" type="button" disabled>
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3a.5.5 0 0 0 0-.5l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .1-1.3c0-.1-.2-.2-.5-.3Z"/></svg>
      Checkout on WhatsApp
    </button>
  </div>

</aside>


<!-- FOOTER -->
<footer class="site-footer fade">
  <div class="footer-inner">
    <div class="footer-brand">
      <p class="footer-name" id="footer-name"></p>
      <p class="footer-tagline" id="footer-tagline"></p>
    </div>
    <div class="footer" id="footer"></div>
  </div>
  <p class="footer-note" id="footer-note"></p>
</footer>

<!-- PRODUCT PREVIEW MODAL -->
<div id="product-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">

  <div class="modal-content">

    <button class="icon-btn close-modal" type="button" aria-label="Close product preview">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></svg>
    </button>

    <div class="modal-media">
      <img id="modal-image" src="" alt="">
    </div>

    <div class="modal-body">
      <div id="modal-meta" class="modal-meta">
        <span id="modal-category" class="modal-category" hidden></span>
        <span id="modal-availability" class="modal-availability" hidden></span>
      </div>

      <h2 id="modal-title"></h2>

      <p id="modal-description"></p>

      <h3 id="modal-price"></h3>

      <div id="modal-actions" class="modal-actions"></div>
    </div>

  </div>

</div>

<!--
  content.js        -> publishes window.SITE_CONTENT (site text + fallback menu)
  sanity-content.js -> fetches the live menu from Sanity (window.SITE_MENU_READY)
  script.js         -> renders that data and contains all application logic
  Load order matters: content first, loader second, app logic last.
-->
<script src="content.js"></script>
<script src="sanity-content.js"></script>
<script src="script.js"></script>
</body>
</html>
